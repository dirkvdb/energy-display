[package]
name = "energydisplay-firmware"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[features]
debug = []
sim = []

[dependencies]
dashboard-core = { path = "../crates/dashboard-core" }
embedded-graphics = "=0.8.2"
embassy-futures = "=0.1.2"
embassy-net = { version = "=0.9.1", features = ["dhcpv4", "medium-ethernet", "tcp", "udp"] }
embassy-sync = "=0.8.0"
embassy-time = "=0.5.1"
heapless = { version = "=0.9.3", default-features = false }
log = "=0.4.34"
jiff = { version = "=0.2.35", default-features = false, features = ["static"] }
sntpc = { version = "=0.11.0", default-features = false }
sntpc-net-embassy = { version = "=0.11.0", default-features = false }
sntpc-time-embassy = { version = "=0.6.0", default-features = false }
rust-mqtt = { version = "=0.5.1", default-features = false, features = ["v5", "bump"] }

[target.'cfg(target_arch = "xtensa")'.dependencies]
display-interface = "=0.5.0"
display-interface-spi = "=0.5.0"
embedded-hal = "=1.0.0"
embedded-hal-bus = "=0.3.0"
embassy-executor = "=0.10.0"
embedded-io-async = "=0.7.0"
embedded-nal-async = "=0.9.0"
reqwless = { version = "=0.14.0", default-features = false }
esp-alloc = { git = "https://github.com/esp-rs/esp-hal.git", tag = "esp-hal-v1.2.0", default-features = false, features = ["esp32s3", "global-allocator", "compat"] }
esp-backtrace = { version = "=0.20.0", features = ["esp32s3", "println"] }
esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal.git", tag = "esp-hal-v1.2.0", features = ["esp32s3"] }
esp-hal = { git = "https://github.com/esp-rs/esp-hal.git", tag = "esp-hal-v1.2.0", features = ["esp32s3", "unstable"] }
esp-println = { version = "=0.18.0", features = ["esp32s3"] }
esp-radio = { git = "https://github.com/esp-rs/esp-hal.git", tag = "esp-hal-v1.2.0", default-features = false, features = ["esp32s3", "wifi", "esp-alloc"] }
esp-rtos = { git = "https://github.com/esp-rs/esp-hal.git", tag = "esp-hal-v1.2.0", features = ["esp32s3", "embassy", "esp-radio"] }
esp-storage = { git = "https://github.com/esp-rs/esp-hal.git", tag = "esp-hal-v1.2.0", features = ["esp32s3"] }
st7305 = { version = "=0.1.2", features = ["async", "graphics"] }
static_cell = "=2.1.1"
