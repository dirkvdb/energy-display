[package]
name = "energydisplay-firmware"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
dashboard-core = { path = "../crates/dashboard-core" }
embedded-graphics = "=0.8.2"

[target.'cfg(target_arch = "xtensa")'.dependencies]
display-interface = "=0.5.0"
display-interface-spi = "=0.5.0"
embedded-hal = "=1.0.0"
embedded-hal-bus = "=0.3.0"
embassy-executor = "=0.10.0"
embassy-time = "=0.5.1"
esp-alloc = { version = "=0.11.0", default-features = false, features = ["esp32s3", "global-allocator"] }
esp-backtrace = { version = "=0.20.0", features = [
  "esp32s3",
  "panic-handler",
  "println",
] }
esp-bootloader-esp-idf = { version = "=0.6.0", features = ["esp32s3"] }
esp-hal = { version = "=1.2.0", features = ["esp32s3", "unstable"] }
esp-println = { version = "=0.18.0", features = ["esp32s3"] }
esp-rtos = { version = "=0.4.0", features = ["esp32s3", "embassy"] }
st7305 = { version = "=0.1.2", features = ["async", "graphics"] }
