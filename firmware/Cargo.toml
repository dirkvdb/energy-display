[package]
name = "energydisplay-firmware"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[features]
debug = []
sim = []

[dependencies]
dashboard-core = { path = "../crates/dashboard-core" }
embedded-graphics = "0.8"
embassy-futures = "0.1"
embassy-net = { version = "0.9", features = ["auto-icmp-echo-reply", "dhcpv4", "dns", "medium-ethernet", "tcp", "udp"] }
embassy-sync = "0.8"
embassy-time = "0.5"
embedded-nal-async = "0.9"
heapless = { version = "0.9", default-features = false }
log = "0.4"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde-json-core = "0.6"
jiff = { version = "0.2", default-features = false, features = ["static"] }
sntpc = { version = "0.11", default-features = false }
sntpc-net-embassy = { version = "0.11", default-features = false }
sntpc-time-embassy = { version = "0.6", default-features = false }
rust-mqtt = { version = "0.6", default-features = false, features = ["v5", "bump"] }

[target.'cfg(target_arch = "xtensa")'.dependencies]
display-interface = "0.5"
display-interface-spi = "0.5"
embedded-hal = "1.0"
embedded-hal-bus = "0.3"
embassy-executor = "0.10"
embedded-io-async = "0.7"
reqwless = { version = "0.14", default-features = false }
hmac = { version = "0.13", default-features = false }
sha2 = { version = "0.11", default-features = false }
esp-alloc = { git = "https://github.com/esp-rs/esp-hal.git", tag = "esp-hal-v1.2.0", default-features = false, features = ["esp32s3", "compat", "internal-heap-stats"] }
esp-backtrace = { version = "0.20", features = ["esp32s3", "println"] }
esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal.git", tag = "esp-hal-v1.2.0", features = ["esp32s3"] }
esp-hal = { git = "https://github.com/esp-rs/esp-hal.git", tag = "esp-hal-v1.2.0", features = ["esp32s3", "unstable"] }
esp-println = { version = "0.18", features = ["esp32s3"] }
esp-radio = { git = "https://github.com/esp-rs/esp-hal.git", tag = "esp-hal-v1.2.0", default-features = false, features = ["esp32s3", "wifi", "esp-alloc", "unstable"] }
esp-rtos = { git = "https://github.com/esp-rs/esp-hal.git", tag = "esp-hal-v1.2.0", features = ["esp32s3", "embassy", "esp-radio"] }
esp-storage = { git = "https://github.com/esp-rs/esp-hal.git", tag = "esp-hal-v1.2.0", features = ["esp32s3"] }
st7305 = { version = "0.1", features = ["async", "graphics"] }
static_cell = "2.1"
