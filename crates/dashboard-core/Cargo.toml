[package]
name = "dashboard-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
embedded-graphics = "0.8"
heapless = "0.8"
jiff = { version = "0.2", default-features = false, features = ["static"] }
num-traits = { version = "0.2", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde-json-core = "0.6"

[build-dependencies]
cosmic-text = { version = "0.19", default-features = false, features = ["no_std", "swash"] }

[dev-dependencies]
cosmic-text = { version = "0.19", default-features = false, features = ["no_std", "swash"] }

[[bench]]
name = "render"
harness = false
