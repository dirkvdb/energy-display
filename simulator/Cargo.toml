[package]
name = "energydisplay-simulator"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
critical-section = { version = "1.2", features = ["std"] }
dashboard-core = { path = "../crates/dashboard-core" }
embassy-executor = { version = "0.10", features = ["platform-std", "executor-thread", "log"] }
embassy-net = { version = "0.9", features = ["dns", "medium-ethernet", "proto-ipv4", "std", "tcp"] }
embassy-net-tuntap = "0.1"
embassy-time = { version = "0.5", features = ["log", "std"] }
embedded-graphics = "0.8"
embedded-graphics-simulator = "0.8"
heapless = { version = "0.9", default-features = false }

energydisplay-firmware = { path = "../firmware", features = ["sim"] }
env_logger = "0.11"
log = "0.4"
static_cell = "2.1"
